[behave]
# Default behavior configuration
paths = features/
show_skipped = false
color = true

# Show summary and timings
summary = true
show_timings = true

# Run all feature files by default
# No tag filtering - runs everything
default_tags = 

# Suppress verbose tracebacks for cleaner output
verbose = false

# Stop on first failure (comment out to run all tests)
# stop = true

# Capture output to suppress tracebacks
# Set to true to hide full Python tracebacks
capture = true

# Logging level
logging_level = WARNING

# Output format (don't specify file to avoid creating output files)
# Using default stdout output

