[behave]
# Default behavior configuration
paths = features/
show_skipped = false
color = true

# Show detailed output
summary = true
show_timings = true

# Run all feature files by default
# No tag filtering - runs everything
default_tags = 

# Verbose output for better test visibility
verbose = true

# Stop on first failure (comment out to run all tests)
# stop = true

# Don't capture stdout/stderr - show output in terminal
capture = false

# Output format (don't specify file to avoid creating output files)
# Using default stdout output

